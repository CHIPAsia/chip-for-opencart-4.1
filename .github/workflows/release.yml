name: Create Release Zip

on:
  release:
    types: [created]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create zip file
        run: |
          # The name MUST stay chip.ocmod.zip. Beyond the .ocmod.zip suffix that
          # core requires of every upload (marketplace/installer.php checks
          # substr($filename, -10)), 4.x stores basename($filename, '.ocmod.zip')
          # as the extension CODE. Code is both the extraction folder and the
          # route prefix, and this module's routes are extension/chip/..., so a
          # renamed file would install where no route can reach it.
          zip -r chip.ocmod.zip \
            admin/ \
            catalog/ \
            install.json \
            README.md \
            Lax-Settings.png \
            -x "*.DS_Store" "*.git*"
      
      - name: Upload release asset
        run: |
          gh release upload "${{ github.event.release.tag_name }}" chip.ocmod.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

